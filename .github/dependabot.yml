version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Check for docker image updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Check for python package updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
